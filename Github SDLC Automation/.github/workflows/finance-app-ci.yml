name: Finance App CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bob/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Install, lint, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: finance-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: finance-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  bob-feature-flow:
    name: Bob-assisted feature workflow guidance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Explain Bob collaboration workflow
        run: |
          echo "This workflow validates the repository and documents the expected Bob collaboration flow."
          echo "Example flow:"
          echo "1. A GitHub issue is filed with a feature request."
          echo "2. Bob creates a bob/** branch from main."
          echo "3. Bob analyses the codebase and implements the feature."
          echo "4. Bob runs: npm run typecheck && npm test && npm run build."
          echo "5. Bob commits and pushes the branch."
          echo "6. Bob opens a PR that references 'Closes #N' for the issue."
          echo "7. CI runs the validate job; a maintainer reviews and merges."
